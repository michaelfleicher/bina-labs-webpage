    - paragraph [ref=e173]: Why don't strategy decks ship AI to production? Decks describe ambition; production AI needs evals, retrieval pipelines, on-prem cost budgets, and someone willing to debug at 2 a.m. Bina Labs builds the system, hands you the runbook, and leaves on day 90 with your team owning the code.
